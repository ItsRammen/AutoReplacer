name: Build APK

# Push a tag like v0.7.17 (it must equal versionName in openheadunit/app/build.gradle.kts, with a leading "v")
# and this builds the APK, runs the plain-Java checks, and attaches the APK to a GitHub release.
# "Run workflow" (manual) builds and uploads the APK as a workflow artifact. If you also give it an existing release
# tag (for example v0.7.17), the APK is attached to that release, which is how to retry a release without re-tagging.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the APK to (for example v0.7.17). Leave empty to only upload an artifact.'
        required: false
        default: ''

permissions:
  contents: write   # to create or update the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already has the Android SDK ($ANDROID_HOME); only the pieces this app needs are added.
      - name: Install SDK packages
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read the app version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' openheadunit/app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"
          TAG=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="${{ inputs.tag }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ] && [ "$TAG" != "v${VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match versionName ${VERSION}. Use v${VERSION}, or change versionName first."
            exit 1
          fi

      - name: Plain-Java checks
        run: sh openheadunit/autoshow-tests/run.sh

      - name: Build the APK
        working-directory: openheadunit
        run: ./gradlew --no-daemon :app:assembleGithubDebug

      - name: Sign with the release key (if the secrets exist)
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          SRC=$(ls openheadunit/app/build/outputs/apk/github/debug/*.apk | head -n1)
          OUT="AutoReplacer-v${{ steps.version.outputs.version }}.apk"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            # A separate key password if one is set, otherwise the keystore password.
            if [ -n "$KEY_PASSWORD" ]; then KEYPASS_SOURCE="env:KEY_PASSWORD"; else KEYPASS_SOURCE="env:KEYSTORE_PASSWORD"; fi
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass "$KEYPASS_SOURCE" \
              --out "$OUT" "$SRC"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$OUT" | head -3
            echo "signed=release" >> "$GITHUB_OUTPUT"
          else
            cp "$SRC" "$OUT"
            echo "signed=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets set: this APK is signed with this run's temporary debug key and will not update over any other build."
          fi
          sha256sum "$OUT" | tee "$OUT.sha256"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "## AutoReplacer ${VERSION}"
            echo
            echo "Android Auto on an **Auto+ Show (Garmin USB Link)** car screen. A hard fork of [Open Headunit](https://github.com/andreknieriem/open-headunit), GNU AGPL v3. **Working prototype**, tested on one car and one phone: read the [README](https://github.com/${GITHUB_REPOSITORY}#limitations) first."
            echo
            echo "### Changes"
            awk -v v="### ${VERSION}" '$0==v{f=1;next} f&&/^(### |## )/{exit} f' openheadunit/CHANGELOG-AUTOREPLACER.md
            echo
            if [ "${{ steps.sign.outputs.signed }}" = "release" ]; then
              echo "Signed with the project's release key, so later releases update over this one."
            else
              echo "**Signed with a temporary debug key:** uninstall any earlier AutoReplacer build before installing, and expect to uninstall again for the next release."
            fi
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 "${{ steps.sign.outputs.apk }}.sha256")\`"
          } > release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sign.outputs.apk }}
          path: |
            ${{ steps.sign.outputs.apk }}
            ${{ steps.sign.outputs.apk }}.sha256

      - name: Attach to the GitHub release
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: AutoReplacer ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          prerelease: true
          files: |
            ${{ steps.sign.outputs.apk }}
            ${{ steps.sign.outputs.apk }}.sha256
